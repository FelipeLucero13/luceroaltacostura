{% extends 'base.html' %}

{% block body %}

<div class="container">
    <div class="row align-items-center justify-content-center vh-100">
        <!-- Sección del logo y título -->
        <div class="col-12 col-md-6 text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" class="img-fluid w-50" alt="Lucero Alta Costura">
            <h2 class="mt-3"><b>Lucero Alta Costura</b></h2>
            <p class="text-muted">Diseños personalizados a tu medida</p>
        </div>

        <!-- Sección del formulario -->
        <div class="col-12 col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Ingreso al Sistema</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <!-- Campo de Usuario -->
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control border-dark" id="usuario" name="usuario" 
                                   placeholder="Ingresa tu usuario" required>
                        </div>
                        <!-- Campo de Contraseña -->
                        <div class="mb-3">
                            <label for="clave" class="form-label">Clave de Seguridad</label>
                            <input type="password" class="form-control border-dark" id="clave" name="clave" 
                                   placeholder="Ingresa tu contraseña" required>
                        </div>
                        <!-- Botón de Inicio de Sesión -->
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg" type="submit">Iniciar Sesión</button>
                        </div>
                        <!-- Enlace a Registro -->
                        <div class="text-center mt-3">
                            <a href="{{ url_for('register') }}" class="text-decoration-none">¿No tienes cuenta? Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
